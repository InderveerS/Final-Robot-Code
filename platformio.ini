; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ----------------------------------------------------------------
; Private package store, so this project never shares packages with the
; sd_logging project. Both need tool-esptoolpy and it is non-optional on both,
; but at incompatible major versions - ~1.40501.0 here vs ~2.41100.0 on
; sd_logging's pioarduino platform. It installs to a single unversioned
; packages/tool-esptoolpy directory, so with one shared store every switch
; between the two projects uninstalled one version and reinstalled the other.
;
; This project is the cheap one to isolate (~500 MB: registry platform, no
; pioarduino IDF toolchains or ESP-IDF libs). Kept outside .pio so cleaning the
; build does not throw the toolchain away.
; ----------------------------------------------------------------
[platformio]
; core_dir = C:\Users\inder\.platformio-robot

[env:esp32-s3-devkitm-1]
; Pinned EXACTLY, not "~6.5.0". With its own store this project resolves the
; platform from scratch, and ~6.5.0 would allow a patch bump to drift the
; compiler under the competition firmware. 6.5.0 is the version this robot has
; always been built with.
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BNO055@^1.6.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    ; 3.x requires arduino-esp32 core 3.x; this platform is core 2.0.x, so pin 1.x
    madhephaestus/ESP32Servo@^1.2.1